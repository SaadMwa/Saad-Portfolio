<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#141a2e"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad2)" rx="12"/>

  <!-- App Header -->
  <rect x="0" y="0" width="800" height="50" fill="#090d16" opacity="0.9"/>
  <circle cx="25" cy="25" r="6" fill="#ef4444"/>
  <circle cx="45" cy="25" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="25" r="6" fill="#10b981"/>
  <text x="95" y="30" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">ConnectHub — WebRTC Video Room #4092</text>
  <rect x="650" y="15" width="120" height="22" rx="11" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.4)"/>
  <circle cx="665" cy="26" r="4" fill="#10b981"/>
  <text x="675" y="30" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700">WebRTC Connected</text>

  <!-- Main Peer Video Tile -->
  <rect x="25" y="65" width="540" height="310" rx="10" fill="#131c2e" stroke="rgba(0,242,254,0.3)"/>
  <!-- Video Feed Simulation -->
  <circle cx="295" cy="200" r="55" fill="rgba(0,242,254,0.1)"/>
  <circle cx="295" cy="180" r="22" fill="#00f2fe" opacity="0.8"/>
  <path d="M 255 235 Q 295 210 335 235 Z" fill="#00f2fe" opacity="0.8"/>
  <rect x="40" y="80" width="100" height="24" rx="12" fill="rgba(0,0,0,0.6)"/>
  <text x="52" y="96" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">👤 Peer: Remote</text>

  <!-- Self Local Video Tile (PiP) -->
  <rect x="405" y="245" width="145" height="110" rx="8" fill="#0f172a" stroke="rgba(255,255,255,0.2)"/>
  <circle cx="477" cy="290" r="15" fill="#6366f1" opacity="0.9"/>
  <path d="M 452 325 Q 477 305 502 325 Z" fill="#6366f1" opacity="0.9"/>
  <rect x="410" y="250" width="60" height="16" rx="8" fill="rgba(0,0,0,0.6)"/>
  <text x="418" y="262" fill="#f8fafc" font-family="sans-serif" font-size="9">You (Local)</text>

  <!-- Side Panel / Chat / Signaling Log -->
  <rect x="580" y="65" width="195" height="310" rx="10" fill="#131c2e" stroke="rgba(255,255,255,0.08)"/>
  <text x="595" y="90" fill="#00f2fe" font-family="sans-serif" font-size="12" font-weight="700">SIGNALING STREAM</text>

  <rect x="590" y="105" width="175" height="40" rx="6" fill="#0f172a"/>
  <text x="600" y="122" fill="#38bdf8" font-family="monospace" font-size="10">Socket.io: sdp_offer</text>
  <text x="600" y="137" fill="#94a3b8" font-family="monospace" font-size="9">ICE candidate exchange...</text>

  <rect x="590" y="155" width="175" height="40" rx="6" fill="#0f172a"/>
  <text x="600" y="172" fill="#34d399" font-family="monospace" font-size="10">Zod Validation: Passed</text>
  <text x="600" y="187" fill="#94a3b8" font-family="monospace" font-size="9">JWT auth token verified</text>

  <rect x="590" y="205" width="175" height="40" rx="6" fill="#0f172a"/>
  <text x="600" y="222" fill="#a5b4fc" font-family="monospace" font-size="10">MediaStream: Audio/Video</text>
  <text x="600" y="237" fill="#94a3b8" font-family="monospace" font-size="9">Bitrate: 2.4 Mbps (P2P)</text>

  <!-- Control Bar -->
  <rect x="230" y="388" width="340" height="50" rx="25" fill="#090d16" stroke="rgba(255,255,255,0.1)"/>
  <circle cx="280" cy="413" r="16" fill="#1e293b"/>
  <text x="274" y="418" fill="#f8fafc" font-size="14">🎤</text>

  <circle cx="340" cy="413" r="16" fill="#1e293b"/>
  <text x="334" y="418" fill="#f8fafc" font-size="14">📹</text>

  <circle cx="400" cy="413" r="16" fill="#1e293b"/>
  <text x="394" y="418" fill="#f8fafc" font-size="14">🖥️</text>

  <circle cx="460" cy="413" r="16" fill="#ef4444"/>
  <text x="454" y="418" fill="#ffffff" font-size="14">📞</text>
</svg>
